version: "3.9"

# Local development services — Postgres + Redis
# These mirror what Supabase provides in production.
# Run with: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apexium_dev
    ports:
      - "5432:5432"
    volumes:
      - apexium_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apexium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - apexium_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apexium_postgres_data:
    name: apexium_postgres_data
  apexium_redis_data:
    name: apexium_redis_data
